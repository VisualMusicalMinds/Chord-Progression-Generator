<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chord Grid Progression UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: stretch;
      background: #fff;
    }
    .centered-app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      width: 100vw;
      box-sizing: border-box;
      padding: 0;
    }
    .progression-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2.5vw;
      margin-bottom: 1.5vw;
      width: 100vw;
      padding: 0 2vw;
      box-sizing: border-box;
      flex-wrap: wrap;
      gap: 2vw;
    }
    .play-controls-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-width: 3em;
      gap: 1.2em;
      height: auto;
      flex-shrink: 0;
    }
    .play-btn {
      width: 2.7em;
      height: 2.7em;
      min-width: 2.2em;
      min-height: 2.2em;
      border-radius: 50%;
      border: none;
      outline: none;
      background: #4de26f;
      border: 2.5px solid #24be37;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px #b9bac7a0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em;
      transition: filter 0.12s, box-shadow 0.12s, background 0.12s;
      position: relative;
    }
    .play-btn.playing {
      background: #ff5252;
      border-color: #d11a1a;
    }
    .play-btn .play-icon, .play-btn .stop-icon {
      pointer-events: none;
    }
    .metronome-controls {
      display: flex;
      align-items: center;
      margin-top: 0.2em;
      gap: 0.35em;
      font-size: 1em;
    }
    .metronome-input {
      width: 3.2em;
      font-size: 1em;
      border-radius: 0.4em;
      border: 1.8px solid #b9bac7;
      text-align: center;
      padding: 0.2em 0.1em;
      outline: none;
      transition: border 0.13s;
      margin-right: 0.1em;
      background: #f7fafb;
    }
    .metronome-input:focus {
      border-color: #44d1ff;
    }
    .bpm-label {
      font-size: 0.98em;
      color: #444;
      letter-spacing: 0.03em;
      user-select: none;
      font-weight: 500;
    }
    .slots-container {
      display: flex;
      gap: 1.2em;
      padding: 0.7em 0.7em;
      border-radius: 1em;
      transition: box-shadow 0.18s, border-color 0.18s;
      border: 2.5px solid transparent;
      background: #f7fafd;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 1;
      min-width: 0;
    }
    .slots-container.active {
      border-color: #2ecc40;
      box-shadow: 0 0 0 6px #cbf2d1;
      background: #f8fff8;
    }
    .slot {
      width: 3.5em;
      height: 3.5em;
      min-width: 2.3em;
      min-height: 2.3em;
      border: 2px solid #bbb;
      border-radius: 0.7em;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      color: #888;
      transition: border-color 0.15s, background 0.15s;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      user-select: none;
      flex-shrink: 1;
    }
    .slots-container.active .slot {
      border-color: #66d27b;
      cursor: pointer;
    }
    .slot img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      pointer-events: none;
      max-width: 100%;
      max-height: 100%;
    }
    .slot.slot-active {
      box-shadow: 0 0 0 3px #5ddb8e;
      border-color: #2ecc40 !important;
      background: #e3faec;
    }
    .slot.slot-playing {
      box-shadow: 0 0 0 5px #44d1ff;
      border-color: #44d1ff !important;
      background: #e8faff;
    }
    .slot.slot-delete-hover::after {
      content: "×";
      color: #ff5252;
      font-size: 2em;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.9;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .circle-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.7em;
      margin-left: 1.2vw;
      align-items: center;
      user-select: none;
      flex-shrink: 0;
    }
    .circle-btn {
      width: 2.3em;
      height: 2.3em;
      min-width: 2em;
      min-height: 2em;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      box-shadow: 0 1px 4px #b9bac7a0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
    }
    .circle-btn.green {
      background: #4de26f;
      border: 2px solid #24be37;
    }
    .circle-btn.green:active {
      filter: brightness(0.92);
      box-shadow: 0 0 0 3px #b8fdd1;
    }
    .circle-btn.red {
      background: #ff5252;
      border: 2px solid #d11a1a;
    }
    .circle-btn.red:active {
      filter: brightness(0.92);
      box-shadow: 0 0 0 3px #ffd6d6;
    }
    /* Chord grid styles */
    .chord-grid-container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 2vw;
      background: #fff;
      padding: 1em 0.5em;
      box-sizing: border-box;
    }
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(60px, 20vw));
      grid-template-rows: minmax(60px, 20vw) minmax(60px, 20vw);
      gap: 4px;
      justify-items: center;
      align-items: start;
      background: #fff;
      width: 100%;
      max-width: 420px;
    }
    .chord-box {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 120px;
      min-width: 48px;
      min-height: 48px;
      background: transparent !important;
      border: none !important;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: visible;
      transition: 
        box-shadow 0.1s,
        transform 0.1s cubic-bezier(.4,2,.6,1),
        z-index 0.1s;
      padding: 0 !important;
      margin: 0 !important;
      box-sizing: border-box;
      outline: none !important;
      position: relative;
      touch-action: manipulation;
      user-select: none;
      z-index: 1;
    }
    .chord-box:active,
    .chord-box.active,
    .chord-box.kb-active {
      transform: scale(1.2);
      z-index: 2;
      box-shadow: none !important;
      outline: none !important;
      background: transparent !important;
    }
    .chord-box.assignment-selected {
      box-shadow: 0 0 0 5px #44d1ffcc;
      background: #e8faff !important;
      border-radius: 16px;
      z-index: 3;
      outline: none !important;
    }
    .chord-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      display: block;
      background: transparent !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
    }
    /* Volume control styles */
    .volume-container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2.5vw 0 1.2vw 0;
      background: #fff;
    }
    .volume-label {
      font-family: system-ui, sans-serif;
      font-size: 1em;
      color: #222;
      margin-right: 0.6em;
      letter-spacing: 0.04em;
      user-select: none;
    }
    .volume-slider {
      width: 120px;
      max-width: 40vw;
      accent-color: #5694e3;
      height: 2.5em;
    }
    .volume-value {
      margin-left: 0.7em;
      min-width: 2.5em;
      text-align: right;
      font-family: monospace;
      color: #222;
      font-size: 1em;
      user-select: none;
    }

    /* Responsiveness */
    @media (max-width: 900px) {
      .progression-top-row {
        flex-wrap: wrap;
        gap: 2vw;
      }
      .chord-grid {
        max-width: 330px;
      }
    }
    @media (max-width: 680px) {
      .progression-top-row {
        gap: 1vw;
        margin-top: 1vw;
        margin-bottom: 1vw;
        padding: 0 0.2vw;
      }
      .slots-container {
        gap: 0.5em;
        padding: 0.3em 0.3em;
      }
      .slot {
        width: 2.3em;
        height: 2.3em;
        min-width: 1.5em;
        min-height: 1.5em;
        font-size: 0.95em;
      }
      .play-controls-wrapper {
        min-width: 2em;
        gap: 0.7em;
      }
      .circle-btn, .play-btn {
        width: 1.7em;
        height: 1.7em;
        min-width: 1.4em;
        min-height: 1.4em;
        font-size: 1em;
      }
      .metronome-input {
        width: 2.3em;
        font-size: 0.9em;
      }
      .bpm-label {
        font-size: 0.88em;
      }
      .chord-grid {
        max-width: 210px;
        grid-template-columns: repeat(3, minmax(36px, 1fr));
        grid-template-rows: minmax(36px, 1fr) minmax(36px, 1fr);
      }
      .chord-box {
        max-width: 60px;
        min-width: 24px;
        min-height: 24px;
      }
    }
    @media (max-width: 430px) {
      .progression-top-row, .chord-grid-container, .volume-container {
        flex-direction: column;
        align-items: center !important;
        width: 100vw;
        min-width: 0;
      }
      .play-controls-wrapper {
        flex-direction: row;
        gap: 0.6em;
        margin-right: 0;
        width: 100vw;
        justify-content: center;
        min-width: 0;
      }
      .slots-container {
        width: 98vw;
        min-width: 0;
        max-width: 99vw;
        gap: 0.3em;
        padding: 0.2em 0.2em;
      }
      .slot {
        min-width: 1em;
        min-height: 1em;
        width: 1.5em;
        height: 1.5em;
        font-size: 0.8em;
      }
      .circle-buttons {
        flex-direction: row;
        margin-left: 0;
        gap: 0.4em;
      }
      .chord-grid-container {
        padding: 0.6em 0.1em 0.4em 0.1em;
      }
      .chord-grid {
        max-width: 99vw;
        grid-template-columns: repeat(3, minmax(18px, 1fr));
        grid-template-rows: minmax(18px, 1fr) minmax(18px, 1fr);
        gap: 2px;
      }
      .chord-box {
        max-width: 32px;
        min-width: 16px;
        min-height: 16px;
      }
      .volume-slider {
        width: 60vw;
        min-width: 60px;
      }
      .volume-value, .volume-label {
        font-size: 0.85em;
      }
    }
  </style>
</head>
<body>
  <div class="centered-app-container">
    <div class="progression-top-row">
      <div class="play-controls-wrapper">
        <button class="play-btn" id="play-btn" aria-label="Play/Stop Progression">
          <span class="play-icon" id="play-icon">&#9654;</span>
          <span class="stop-icon" id="stop-icon" style="display:none;">&#9632;</span>
        </button>
        <div class="metronome-controls">
          <input type="number" id="bpm-input" class="metronome-input" min="40" max="300" value="90">
          <span class="bpm-label">BPM</span>
        </div>
      </div>
      <div class="slots-container" id="slots-container">
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
        <div class="slot" data-slot="3"></div>
      </div>
      <div class="circle-buttons">
        <button class="circle-btn green" id="activate-btn" aria-label="Activate Progression"></button>
        <button class="circle-btn red" id="cancel-btn" aria-label="Cancel Progression"></button>
      </div>
    </div>
    <div class="chord-grid-container">
      <div class="chord-grid">
        <button class="chord-box" id="d-box" data-pos="1A" data-key="f" data-chord="d-box" aria-label="D box" tabindex="0">
          <img class="chord-img" src="https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20D.png" alt="D Chord">
        </button>
        <button class="chord-box" id="g-box" data-pos="1B" data-key="g" data-chord="g-box" aria-label="G box" tabindex="0">
          <img class="chord-img" src="https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20G.png" alt="G Chord">
        </button>
        <button class="chord-box" id="c-box" data-pos="1C" data-key="h" data-chord="c-box" aria-label="C box" tabindex="0">
          <img class="chord-img" src="https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20C.png" alt="C Chord">
        </button>
        <div></div>
        <button class="chord-box" id="em-box" data-pos="2B" data-key="b" data-chord="em-box" aria-label="Em box" tabindex="0">
          <img class="chord-img" src="https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20Em.png" alt="Em Chord">
        </button>
        <div></div>
      </div>
    </div>
    <div class="volume-container">
      <span class="volume-label">Volume</span>
      <input type="range" min="0" max="100" step="1" value="66" class="volume-slider" id="volume-slider" aria-label="Volume">
      <span class="volume-value" id="volume-value">66%</span>
    </div>
  </div>
  <script>
    // Assignment mode state
    let assignmentMode = false;
    let selectedChordBox = null; // HTMLElement of selected chord-box for assignment
    let slotImages = [null, null, null, null]; // Store src of assigned images for slots

    // Chord box image map (id to image src and alt)
    const chordBoxImageMap = {
      "d-box": {
        src: "https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20D.png",
        alt: "D Chord"
      },
      "g-box": {
        src: "https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20G.png",
        alt: "G Chord"
      },
      "c-box": {
        src: "https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20C.png",
        alt: "C Chord"
      },
      "em-box": {
        src: "https://raw.githubusercontent.com/VisualMusicalMinds/Musical-Images/refs/heads/main/ChordBox%20Em.png",
        alt: "Em Chord"
      }
    };

    // DOM refs
    const slotsContainer = document.getElementById('slots-container');
    const slotElements = Array.from(document.querySelectorAll('.slot'));
    const activateBtn = document.getElementById('activate-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const chordBoxes = Array.from(document.querySelectorAll('.chord-box'));
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const stopIcon = document.getElementById('stop-icon');
    const bpmInput = document.getElementById('bpm-input');

    // Playback state
    let isPlaying = false;
    let playLoopTimer = null;
    let playState = {
      slotIndex: 0,
      beat: 0
    };
    let playBpm = parseInt(bpmInput.value, 10) || 90;

    // Assignment mode functions
    function enterAssignmentMode() {
      assignmentMode = true;
      slotsContainer.classList.add('active');
      document.body.classList.add('assignment-mode');
      clearChordSelection();
      slotElements.forEach(slot => slot.classList.remove('slot-active'));
    }
    function exitAssignmentMode() {
      assignmentMode = false;
      slotsContainer.classList.remove('active');
      document.body.classList.remove('assignment-mode');
      clearChordSelection();
      slotElements.forEach(slot => slot.classList.remove('slot-active'));
      slotElements.forEach(slot => slot.classList.remove('slot-delete-hover'));
    }
    function clearChordSelection() {
      chordBoxes.forEach(box => box.classList.remove('assignment-selected'));
      selectedChordBox = null;
    }
    function selectChordBoxForAssignment(box) {
      clearChordSelection();
      box.classList.add('assignment-selected');
      selectedChordBox = box;
    }
    function assignChordToSlot(slotIdx) {
      if (!selectedChordBox) return;
      const chordId = selectedChordBox.getAttribute('data-chord');
      const imgInfo = chordBoxImageMap[chordId];
      if (!imgInfo) return;
      slotImages[slotIdx] = imgInfo;
      const slot = slotElements[slotIdx];
      slot.innerHTML = `<img src="${imgInfo.src}" alt="${imgInfo.alt}">`;
      slot.classList.add('slot-active');
      clearChordSelection();
    }
    function clearSlot(idx) {
      slotImages[idx] = null;
      slotElements[idx].innerHTML = '';
      slotElements[idx].classList.remove('slot-active');
    }
    function clearAllSlots() {
      slotImages = [null, null, null, null];
      slotElements.forEach(slot => {
        slot.innerHTML = '';
        slot.classList.remove('slot-active');
      });
    }

    // Event listeners
    activateBtn.addEventListener('click', enterAssignmentMode);
    cancelBtn.addEventListener('click', () => {
      exitAssignmentMode();
    });

    // Chord box click
    chordBoxes.forEach(box => {
      box.addEventListener('click', e => {
        if (assignmentMode) {
          selectChordBoxForAssignment(box);
        } else if (!isPlaying) {
          playClearMarimbaChord(chordData[box.id]);
        }
      });
    });

    // Slot click for both assignment and delete (assignment mode only)
    slotElements.forEach((slot, idx) => {
      slot.addEventListener('click', e => {
        if (assignmentMode) {
          // If there's a chord in the slot and no chord selected, delete it
          if (slotImages[idx] && !selectedChordBox) {
            clearSlot(idx);
          }
          // If a chord is selected, assign it to the slot
          else if (selectedChordBox) {
            assignChordToSlot(idx);
          }
        }
      });
      slot.addEventListener('mouseenter', e => {
        if (assignmentMode && slotImages[idx]) {
          slot.classList.add('slot-delete-hover');
        }
      });
      slot.addEventListener('mouseleave', e => {
        slot.classList.remove('slot-delete-hover');
      });
    });

    // PLAY/STOP and PROGRESSION LOGIC
    function setPlayBtnState(playing) {
      if (playing) {
        playBtn.classList.add('playing');
        playIcon.style.display = 'none';
        stopIcon.style.display = '';
      } else {
        playBtn.classList.remove('playing');
        playIcon.style.display = '';
        stopIcon.style.display = 'none';
      }
    }
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        playBpm = parseInt(bpmInput.value, 10) || 90;
        startProgressionPlayback();
      } else {
        stopProgressionPlayback();
      }
    });
    bpmInput.addEventListener('input', () => {
      let val = parseInt(bpmInput.value, 10);
      if (isNaN(val) || val < 40) val = 40;
      else if (val > 300) val = 300;
      bpmInput.value = val;
      playBpm = val;
    });
    function startProgressionPlayback() {
      if (isPlaying) return;
      isPlaying = true;
      setPlayBtnState(true);
      playState = { slotIndex: 0, beat: 0 };
      clearAllSlotPlayingHighlight();
      nextProgressionBeat();
    }
    function stopProgressionPlayback() {
      isPlaying = false;
      setPlayBtnState(false);
      if (playLoopTimer) clearTimeout(playLoopTimer);
      clearAllSlotPlayingHighlight();
    }
    function clearAllSlotPlayingHighlight() {
      slotElements.forEach(slot => slot.classList.remove('slot-playing'));
    }
    function nextProgressionBeat() {
      if (!isPlaying) return;
      const quarter = 60000 / playBpm;
      clearAllSlotPlayingHighlight();
      // Highlight the current slot
      const curSlotIdx = playState.slotIndex;
      slotElements[curSlotIdx].classList.add('slot-playing');
      // Play the chord (if any) or silence
      const chordInfo = slotImages[curSlotIdx];
      if (chordInfo && chordInfo.src) {
        let chordId = null;
        for (const [id, info] of Object.entries(chordBoxImageMap)) {
          if (info.src === chordInfo.src) {
            chordId = id;
            break;
          }
        }
        if (chordId && chordData[chordId]) {
          playClearMarimbaChord(chordData[chordId]);
        }
      }
      playState.beat++;
      if (playState.beat < 4) {
        playLoopTimer = setTimeout(nextProgressionBeat, quarter);
      } else {
        playState.beat = 0;
        playState.slotIndex++;
        if (playState.slotIndex >= 4) {
          playState.slotIndex = 0;
        }
        playLoopTimer = setTimeout(nextProgressionBeat, quarter);
      }
    }
    cancelBtn.addEventListener('click', stopProgressionPlayback);

    // CLEAR MARIMBA-LIKE SYNTH
    const noteFreqs = {
      "C3": 130.81, "C#3": 138.59, "Db3": 138.59, "D3": 146.83, "D#3": 155.56, "Eb3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "Gb3": 185.00, "G3": 196.00, "G#3": 207.65, "Ab3": 207.65, "A3": 220.00, "Bb3": 233.08, "B3": 246.94,
      "C4": 261.63, "C#4": 277.18, "Db4": 277.18, "D4": 293.66, "D#4": 311.13, "Eb4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "Gb4": 369.99, "G4": 392.00, "G#4": 415.30, "Ab4": 415.30, "A4": 440.00, "Bb4": 466.16, "B4": 493.88,
      "C5": 523.25, "C#5": 554.37, "Db5": 554.37, "D5": 587.33, "D#5": 622.25, "Eb5": 622.25, "E5": 659.25, "F5": 698.46, "F#5": 739.99, "Gb5": 739.99, "G5": 783.99, "A5": 880.00, "B5": 987.77
    };
    function getFreq(note) {
      return noteFreqs[note] || 440;
    }
    // Volume control
    let userVolume = 0.66;
    const globalGain = (() => {
      const ctx = getAudioCtx();
      const gain = ctx.createGain();
      gain.gain.value = userVolume;
      gain.connect(ctx.destination);
      return gain;
    })();
    function getAudioCtx() {
      if (!window._audioCtx) {
        window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return window._audioCtx;
    }
    function playClearMarimbaChord(notes, options = {}) {
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const duration = options.duration || 0.34;
      const stagger = options.stagger || 0.028;
      const gain = options.gain || 0.17;
      notes.forEach((note, i) => {
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        let gainNode = ctx.createGain();
        gainNode.gain.value = 1;
        const env = ctx.createGain();
        env.gain.setValueAtTime(0.001, now + i * stagger);
        env.gain.linearRampToValueAtTime(gain, now + i * stagger + 0.005);
        env.gain.linearRampToValueAtTime(gain * 0.32, now + i * stagger + duration * 0.25);
        env.gain.linearRampToValueAtTime(0.001, now + i * stagger + duration);
        const filter = ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 240;
        filter.Q.value = 1.5;
        osc.frequency.value = getFreq(note);
        osc.frequency.setValueAtTime(getFreq(note) * 1.04, now + i * stagger);
        osc.frequency.linearRampToValueAtTime(getFreq(note), now + i * stagger + 0.045);
        osc.connect(gainNode).connect(filter).connect(env).connect(globalGain);
        osc.start(now + i * stagger);
        osc.stop(now + i * stagger + duration);
      });
    }
    // Chord definitions
    const chordData = {
      "g-box": ["G3", "D4", "G4", "B4"],
      "d-box": ["D4", "F#4", "A4", "D4"],
      "c-box": ["E4", "G4", "C5", "E5"],
      "em-box": ["E4", "G4", "B4"]
    };
    // Hold logic for quarter note pulse at 137 BPM
    const bpm = 137;
    const quarter = 60000 / bpm; // ms
    const holdTimers = {};
    const repeatPulse = (boxId) => {
      playClearMarimbaChord(chordData[boxId]);
      holdTimers[boxId] = setTimeout(() => {
        if (!holdTimers[boxId]) return;
        repeatPulse(boxId);
      }, quarter);
    };
    function startPulse(box) {
      stopPulse(box.id);
      repeatPulse(box.id);
    }
    function stopPulse(boxId) {
      if (holdTimers[boxId]) {
        clearTimeout(holdTimers[boxId]);
        holdTimers[boxId] = null;
      }
    }
    function setActive(box, on) {
      if (on) {
        box.classList.add('active');
      } else {
        box.classList.remove('active');
      }
    }
    chordBoxes.forEach(box => {
      box.addEventListener('pointerdown', e => {
        if (!assignmentMode && !isPlaying) {
          setActive(box, true);
          startPulse(box);
        }
      });
      box.addEventListener('pointerup', e => {
        if (!assignmentMode && !isPlaying) {
          setActive(box, false);
          stopPulse(box.id);
        }
      });
      box.addEventListener('pointerleave', e => {
        if (!assignmentMode && !isPlaying) {
          setActive(box, false);
          stopPulse(box.id);
        }
      });
      box.addEventListener('touchend', e => {
        if (!assignmentMode && !isPlaying) {
          setActive(box, false);
          stopPulse(box.id);
        }
      });
      box.addEventListener('touchcancel', e => {
        if (!assignmentMode && !isPlaying) {
          setActive(box, false);
          stopPulse(box.id);
        }
      });
    });
    // Keyboard logic: only works in normal mode & not playing progression
    const keyToBoxId = {
      "f": "d-box",
      "g": "g-box",
      "h": "c-box",
      "b": "em-box"
    };
    const downKeys = {};
    document.addEventListener('keydown', e => {
      if (assignmentMode || isPlaying) return;
      const key = e.key.toLowerCase();
      if (keyToBoxId[key] && !downKeys[key]) {
        downKeys[key] = true;
        const box = document.getElementById(keyToBoxId[key]);
        if (box) {
          box.classList.add('kb-active');
          startPulse(box);
          box.blur();
        }
      }
    });
    document.addEventListener('keyup', e => {
      if (assignmentMode || isPlaying) return;
      const key = e.key.toLowerCase();
      if (keyToBoxId[key]) {
        downKeys[key] = false;
        const box = document.getElementById(keyToBoxId[key]);
        if (box) {
          box.classList.remove('kb-active');
          stopPulse(box.id);
        }
      }
    });
    chordBoxes.forEach(box => {
      box.addEventListener('focus', e => {
        box.blur();
      });
    });
    // Volume Control Logic
    const volumeSlider = document.getElementById('volume-slider');
    const volumeValue = document.getElementById('volume-value');
    volumeSlider.addEventListener('input', function () {
      userVolume = volumeSlider.value / 100;
      globalGain.gain.setValueAtTime(userVolume, getAudioCtx().currentTime);
      volumeValue.textContent = Math.round(userVolume * 100) + "%";
    });
    window.addEventListener('DOMContentLoaded', () => {
      globalGain.gain.setValueAtTime(userVolume, getAudioCtx().currentTime);
      volumeValue.textContent = Math.round(userVolume * 100) + "%";
    });
  </script>
</body>
</html>
